[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xzxg-shop-backend-py"
version = "0.1.0"
description = "Python refactor workspace for xzxg-shop"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "bcrypt>=4.2,<5",
]


[tool.setuptools.packages.find]
include = ["app*"]